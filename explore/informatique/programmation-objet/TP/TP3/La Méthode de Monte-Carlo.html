<blockquote>

<h2 id="%F0%9F%93%9C-2-la-petite-histoire-de-monte-carlo"><img class="emoji" draggable="false" alt="📜" src="./La Méthode de Monte-Carlo_files/1f4dc.svg" data-marp-twemoji=""> 2. La petite histoire de Monte-Carlo</h2>
<h3 id="le-casse-t%C3%AAte-de-stanislaw-ulam-1946">Le casse-tête de Stanislaw Ulam (1946)</h3>
<ul>
<li>Mathématicien polono-américain du projet Manhattan.</li>
<li>Alité pendant une convalescence, il joue à la <strong>Réussite</strong> (Solitaire).</li>
<li>Question : <em>« Quelle est la probabilité exacte qu'une donne aléatoire soit gagnable ? »</em></li>
<li>Les calculs combinatoires analytiques sont quasi <strong>impossibles</strong>.</li>
</ul>
<div class="highlight">
<p><strong>L'idée de génie :</strong> Avec les tout premiers ordinateurs (l'ENIAC), pourquoi ne pas simuler 100 parties et compter les victoires ?</p>
</div>
<ul>
<li><strong>John von Neumann</strong> valide l'approche et lui donne le nom de code <strong>« Monte-Carlo »</strong>, en hommage au célèbre casino de Monaco et à sa roulette.</li>
</ul>
<footer>Méthode de Monte-Carlo — TP Jeu de l'Oie</footer>

<h2 id="%F0%9F%A7%90-6-pourquoi-pas-25--pour-chacun"><img class="emoji" draggable="false" alt="🧐" src="./La Méthode de Monte-Carlo_files/1f9d0.svg" data-marp-twemoji=""> 6. Pourquoi pas 25 % pour chacun ?</h2>
<blockquote>
<p>Question légitime : <em>« Pourquoi n'obtient-on pas 25 % pour chaque joueur et 25 % pour l'élimination ? »</em></p>
</blockquote>
<br>
<h3 id="1-une-%C3%A9quit%C3%A9-parfaite-entre-les-joueurs-225">1. Une équité parfaite entre les joueurs (~22.5 %)</h3>
<ul>
<li>Rouge, Vert et Bleu obtiennent quasiment le <strong>même score (22.5 %)</strong>.</li>
<li>Sur 17 tours de jeu, <strong>l'avantage de commencer en premier s'évapore complètement</strong> grâce aux rebonds et aux pièges.</li>
</ul>
<div class="box-danger">
<b>2. Mais un plateau très meurtrier (32.4 %) !</b><br>
Le taux d'élimination totale ne dépend pas des joueurs, mais de la dangerosité des cases pièges (Puits + Piège). Près d'<b>1 partie sur 3</b> n'a aucun vainqueur !
</div>

<h2 id="%F0%9F%8E%AE-8-impact-sur-le-game-design"><img class="emoji" draggable="false" alt="🎮" src="./La Méthode de Monte-Carlo_files/1f3ae.svg" data-marp-twemoji=""> 8. Impact sur le <em>Game Design</em></h2>
<p>La simulation Monte-Carlo est l'outil n°1 des créateurs de jeux :</p>
<h3 id="constat-tir%C3%A9-de-notre-simulation">Constat tiré de notre simulation :</h3>
<p>Le jeu est <strong>parfaitement équitable</strong>, mais <strong>trop punitif</strong> (32.4 % de défaites collectives).</p>
<h3 id="comment-r%C3%A9%C3%A9quilibrer-le-jeu">Comment rééquilibrer le jeu ?</h3>
<ul>
<li><strong>Scénario A :</strong> Remplacer les cases <em>Perdu</em> par un recul de 5 cases.<br>

<h2 id="%F0%9F%8C%8D-9-applications-dans-le-monde-r%C3%A9el"><img class="emoji" draggable="false" alt="🌍" src="./La Méthode de Monte-Carlo_files/1f30d.svg" data-marp-twemoji=""> 9. Applications dans le monde réel</h2>
<p>La méthode de Monte-Carlo est omniprésente en ingénierie :</p>
<ul>
<li><img class="emoji" draggable="false" alt="📈" src="./La Méthode de Monte-Carlo_files/1f4c8.svg" data-marp-twemoji=""> <strong>Finance &amp; Bourse :</strong> Modéliser 100 000 trajectoires de marchés pour évaluer le risque de faillite d'un portefeuille (<em>Value at Risk</em>).</li>
<li><img class="emoji" draggable="false" alt="🌪️" src="./La Méthode de Monte-Carlo_files/1f32a.svg" data-marp-twemoji=""> <strong>Météorologie :</strong> Prédire la trajectoire probable d'un cyclone en croisant 50 simulations avec de légères perturbations.</li>
<li><img class="emoji" draggable="false" alt="🤖" src="./La Méthode de Monte-Carlo_files/1f916.svg" data-marp-twemoji=""> <strong>Intelligence Artificielle :</strong> L'algorithme <strong>MCTS</strong> (<em>Monte-Carlo Tree Search</em>) au cœur d'<strong>AlphaGo</strong> pour évaluer la force d'un coup en simulant des milliers de fins de parties rapides.</li>
<li><img class="emoji" draggable="false" alt="🎬" src="./La Méthode de Monte-Carlo_files/1f3ac.svg" data-marp-twemoji=""> <strong>Jeux Vidéo &amp; Cinéma :</strong> Calculer le rendu de la lumière (<em>Path Tracing</em> / <em>Ray Tracing</em>) en lançant des millions de rayons photoniques aléatoires.</li>
</ul>

<li><strong>Équité vs Équilibrage :</strong>

<li>Les joueurs sont à égalité si leurs taux de victoires sont identiques (ici 22.5 % chacun).</li>
<li>Le taux de parties sans vainqueur (32.4 %) mesure la difficulté globale du plateau.</li>
</ul>
</li>
</ol>

</ol>
