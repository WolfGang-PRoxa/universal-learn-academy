<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Universal Learn Academy</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #fafaf8;
        --texte: #1f2024;
        --texte-2: #63646b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #131417;
          --texte: #ececee;
          --texte-2: #a0a1a8;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--fond);
      }
      body {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        padding: 1rem;
        color: var(--texte);
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 34rem;
        min-height: 1.3em;
        color: var(--texte-2);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <img src="assets/icone.png" alt="" />
    <h1>Universal Learn Academy</h1>
    <p id="etat">Démarrage du serveur local…</p>
    <script>
      function noter(ligne) {
        document.getElementById('etat').textContent = ligne;
      }
    </script>
  </body>
</html>
