<!doctype html>
<html lang="fr" class="integre">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paramètres de Universal Learn Academy</title>
    <link rel="stylesheet" href="parametres.css" />
  </head>
  <body>
    <!-- Paramètres ouverts dans la fenêtre des cours (2.6.2) : voile sur la page et
       panneau centré ; seul le contenu du panneau défile -->
    <div class="voile" id="voile"></div>
    <div class="panneau" id="panneau" role="dialog" aria-modal="true" aria-labelledby="titre">
      <header class="entete">
        <img src="../assets/icone.png" alt="" width="40" height="40" />
        <div class="entete-texte">
          <h1 id="titre">Paramètres</h1>
          <p class="discret" id="sous-titre">Universal Learn Academy</p>
        </div>
        <button type="button" class="bouton-fermer" id="fermer" aria-label="Fermer" title="Fermer (Échap)"></button>
      </header>
      <div class="corps">
        <nav class="sommaire" aria-label="Sections"></nav>
        <div class="defilement" id="defilement">
          <main id="cartes"></main>
        </div>
      </div>
      <div id="notes" class="notes" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="parametres.js"></script>
  </body>
</html>
