<!doctype html>
<html lang="fr" class="integre doc">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documentation</title>
    <link rel="stylesheet" href="../parametres/parametres.css" />
    <link rel="stylesheet" href="doc.css" />
  </head>
  <body>
    <!-- Documentation ouverte dans la fenêtre des cours (2.7.0), comme les paramètres :
       voile sur la page et panneau centré ; le sommaire et la page défilent chacun -->
    <div class="voile" id="voile"></div>
    <div class="panneau" id="panneau" role="dialog" aria-modal="true" aria-labelledby="titre">
      <header class="entete">
        <button type="button" class="bouton-volet" id="volet" aria-controls="sommaire"></button>
        <img src="../assets/icone.png" alt="" width="40" height="40" />
        <div class="titres">
          <h1 id="titre">Documentation</h1>
          <p class="discret" id="sous-titre">Universal Learn Academy</p>
        </div>
        <div class="outils-doc">
          <input class="saisie recherche" id="recherche" type="search" autocomplete="off" spellcheck="false" />
          <button type="button" class="bouton principal" id="guide"></button>
        </div>
        <button type="button" class="bouton-fermer" id="fermer" aria-label="Fermer" title="Fermer (Échap)"></button>
      </header>
      <div class="corps">
        <nav class="sommaire-doc" id="sommaire" aria-label="Sommaire"></nav>
        <div class="defilement" id="defilement">
          <main class="page-doc" id="page" tabindex="-1"></main>
        </div>
      </div>
    </div>
    <script type="module" src="doc.js"></script>
  </body>
</html>
