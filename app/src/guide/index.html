<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paramétrage guidé</title>
    <link rel="stylesheet" href="../parametres/parametres.css" />
    <link rel="stylesheet" href="guide.css" />
  </head>
  <body>
    <header class="tete-guide">
      <div class="progression">
        <span id="compteur"></span>
        <div class="barre-progression" aria-hidden="true"><i id="barre"></i></div>
      </div>
    </header>
    <main class="etape" id="etape" tabindex="-1" aria-live="polite"></main>
    <footer class="pied-guide">
      <button type="button" class="bouton leger" id="quitter"></button>
      <span class="espace"></span>
      <button type="button" class="bouton" id="precedent"></button>
      <button type="button" class="bouton principal" id="suivant"></button>
    </footer>
    <div id="notes" class="notes" role="status" aria-live="polite"></div>
    <script type="module" src="guide.js"></script>
  </body>
</html>
