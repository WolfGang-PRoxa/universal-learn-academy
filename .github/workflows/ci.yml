# Intégration continue du dépôt public (recopiée depuis le dépôt de travail par npm run public) :
# contrôle du contenu publié à chaque push et pull request : Prettier, ESLint, vérifications de
# l'application et de ses règles de contenu (scripts/check.mjs), tests automatisés.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
