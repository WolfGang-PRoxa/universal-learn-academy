<header>L3 Informatique - Programmation Ruby</header>
<h1 id="variables-dinstance-dans-un-module">Variables d’instance dans un module</h1>
<ul>
<li>Il peut y avoir des variables d'instance dans un module.</li>
<li>Ces variables d'instance sont ajoutées à toute classe qui utilise le module.</li>
<li>Se pose alors le probleme de l'initialisation de ces variables d'instance à l'instanciation.</li>
<li>Plusieurs solutions possibles :
<ul>
<li>Une méthode d'initialisation définie dans le module et appelée <strong>explicitement</strong> dans l'<code>initialize</code> de la classe</li>
<li>Une méthode <code>initialize</code> dans le module qui doit <strong>aussi</strong> être appelée <strong>explicitement</strong> dans l'<code>initialize</code> de la classe</li>
<li>Utiliser l'<strong>initialisation paresseuse</strong>.</li>
<li>Utiliser le module avec <code>prepend</code> qui <strong>inverse l'ordre de recherche</strong> par rapport à <code>include</code>.</li>
</ul>
</li>
</ul>

<header>L3 Informatique - Programmation Ruby</header>
<h1 id="quelle-solution-choisir">Quelle solution choisir ?</h1>
<ul>
<li><strong><code>include</code></strong> : ajouter des capacités ordinaires aux instances.</li>
<li><strong><code>prepend</code></strong> : modifier ou observer le comportement existant.</li>
<li><strong><code>extend</code></strong> : ajouter une capacité à un objet précis ou à une classe.</li>
<li><strong>Méthode d’initialisation explicite</strong> : pour initialiser proprement les variables du module.</li>
</ul>
<footer>Les Modules en Ruby (aller plus loin)</footer>

<h1 id="bonnes-pratiques">Bonnes pratiques</h1>
<ul>
<li>Préférer une méthode comme <code>init_xxx</code> à un <code>initialize</code> dans un module inclus.</li>
<li>Utiliser <code>prepend</code> si le module doit garantir une initialisation.</li>
<li>Documenter toute obligation d’appeler <code>super</code>.</li>
<li>Éviter les modules trop dépendants de la structure interne des classes hôtes.</li>
</ul>

<h1 id="%C3%A0-retenir">À retenir</h1>
<ul>
<li>Un module fournit du comportement, pas un état propre.</li>
<li>Les variables d’instance vivent dans l’objet.</li>
<li><code>include</code> place le module après la classe.</li>
<li><code>prepend</code> place le module avant la classe.</li>
<li><code>extend</code> cible un objet ou une classe.</li>
<li>Avec <code>include</code>, un <code>initialize</code> de module nécessite un <code>super</code> explicite.</li>
</ul>
